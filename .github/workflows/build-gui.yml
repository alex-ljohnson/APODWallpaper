name: Build Configurator GUI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'ConfiguratorGUI/**'
      - 'APODWallpaper/**' # Trigger if the dependency changes
      - 'Directory.Build.props'
      - 'APODWallpaper.slnx'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'ConfiguratorGUI/**'

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup .NET 10
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Run Tests
      run: dotnet test APODTesting/APODTesting.csproj --configuration Release -p:Patch=${{ github.run_number }}

    - name: Publish Configurator GUI
      # Compiles and publishes just the GUI project
      run: dotnet publish ConfiguratorGUI/ConfiguratorGUI.csproj --configuration Release -p:Patch=${{ github.run_number }} --output ./artifacts/ConfiguratorGUI

    - name: Upload Build Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ConfiguratorGUI-v${{ github.run_number }}
        path: ./artifacts/ConfiguratorGUI