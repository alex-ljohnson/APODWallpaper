name: Build Configurator GUI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'ConfiguratorGUI/**'
      - 'APODWallpaper/**' # Trigger if the dependency changes
      - 'Directory.Build.props'
      - 'APODWallpaper.slnx'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'ConfiguratorGUI/**'

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
      with:
        dotnet-version: '10.0.x'

    - name: Run Tests
      run: dotnet test APODTesting/APODTesting.csproj --configuration Release -p:Patch=${{ github.run_number }}

    - name: Publish Configurator GUI
      # Compiles and publishes just the GUI project
      run: dotnet publish ConfiguratorGUI/ConfiguratorGUI.csproj --configuration Release -p:Patch=${{ github.run_number }} --output ./artifacts/ConfiguratorGUI

    - name: Upload Build Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ConfiguratorGUI-v${{ github.run_number }}
        path: ./artifacts/ConfiguratorGUI